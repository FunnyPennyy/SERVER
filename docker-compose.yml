version: '3.8'

services:
  backend:
    image: handa777/funnypenny-server:latest
    container_name: backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/funnypenny
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      TZ: Asia/Seoul
    depends_on:
      - db
    networks:
      - isolated-network

  db:
    image: mysql:8.0
    container_name: funnypenny-database
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: funnypenny
      TZ: Asia/Seoul
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - isolated-network

volumes:
  db_data:

networks:
  isolated-network:
    driver: bridge
    external: false